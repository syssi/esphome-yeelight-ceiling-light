# configuration based on:
# - https://github.com/syssi/esphome-yeelight-ceiling-light/blob/main/yeelight_light_ceiling15.yaml

# To keep a copy of the stock firmware, uncomment the `packages:` block below
# BEFORE the first flash. Only that first flash leaves the stock firmware
# readable - the next one overwrites it. See docs/flashing-over-the-network.md.
#
# packages:
#   flash_probe: !include flash_probe.yaml

substitutions:
  name: yeelight-light-ceiling24
  external_components_source: github://syssi/esphome-yeelight-ceiling-light@main

esphome:
  name: ${name}
  friendly_name: ${name}
  min_version: 2024.10.0

esp32:
  board: esp32doit-devkit-v1
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_FREERTOS_UNICORE: y
      # Please uncomment these parameters if fast booting is important to you
      # CONFIG_BOOTLOADER_SKIP_VALIDATE_ON_POWER_ON: y
      # CONFIG_BOOTLOADER_LOG_LEVEL_NONE: y
      # CONFIG_LOG_DEFAULT_LEVEL_NONE: y
    advanced:
      ignore_efuse_mac_crc: true
      ignore_efuse_custom_mac: true

external_components:
  - source: ${external_components_source}
    refresh: 0s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2

ota:
  platform: esphome

logger:
  level: DEBUG
  baud_rate: 0

api:

sensor:
  - platform: adc
    pin: GPIO32
    name: "adc1"
    attenuation: 12db
  - platform: adc
    pin: GPIO33
    name: "adc2"
    attenuation: 12db

output:
  # 3 kHz as in the stock firmware
  - platform: ledc
    pin: GPIO19
    id: output_warm
    frequency: 3000
  - platform: ledc
    pin: GPIO21
    id: output_cold
    frequency: 3000

light:
  # Warm/cold mixing of the stock firmware 1.3.2_0003: no interpolation, each table point
  # holds up to the next one
  - platform: yeelight_cct
    name: "ceiling light"
    id: ceiling_light
    warm_white: output_warm
    cold_white: output_cold
    interpolation: none
    min_brightness: 10%
    min_duty: 7%
    mixing_table:
      - {color_temperature: 2700 K, warm_white: 100%, cold_white: 0%}
      - {color_temperature: 3000 K, warm_white: 84.946%, cold_white: 7.870%}
      - {color_temperature: 3200 K, warm_white: 76.344%, cold_white: 15.798%}
      - {color_temperature: 3400 K, warm_white: 68.817%, cold_white: 23.522%}
      - {color_temperature: 4000 K, warm_white: 47.312%, cold_white: 44.213%}
      - {color_temperature: 4500 K, warm_white: 32.506%, cold_white: 59.140%}
      - {color_temperature: 5000 K, warm_white: 19.223%, cold_white: 73.118%}
      - {color_temperature: 5500 K, warm_white: 8.157%, cold_white: 83.871%}
      - {color_temperature: 5800 K, warm_white: 4.831%, cold_white: 87.097%}
      - {color_temperature: 6000 K, warm_white: 0%, cold_white: 100%}
      - {color_temperature: 6500 K, warm_white: 0%, cold_white: 100%}
