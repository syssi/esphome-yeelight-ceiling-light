# To keep a copy of the stock firmware, uncomment the `packages:` block below
# BEFORE the first flash. Only that first flash leaves the stock firmware
# readable - the next one overwrites it. See docs/flashing-over-the-network.md.
#
# packages:
#   flash_probe: !include flash_probe.yaml

substitutions:
  name: yeelight-light-ceiling15
  external_components_source: github://syssi/esphome-yeelight-ceiling-light@main

esphome:
  name: ${name}
  friendly_name: ${name}
  min_version: 2024.10.0

esp32:
  board: esp32doit-devkit-v1
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_FREERTOS_UNICORE: y
      # Please uncomment these parameters if fast booting is important to you
      # CONFIG_BOOTLOADER_SKIP_VALIDATE_ON_POWER_ON: y
      # CONFIG_BOOTLOADER_LOG_LEVEL_NONE: y
      # CONFIG_LOG_DEFAULT_LEVEL_NONE: y
    advanced:
      ignore_efuse_mac_crc: true
      ignore_efuse_custom_mac: true

external_components:
  - source: ${external_components_source}
    refresh: 0s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2

ota:
  platform: esphome

logger:
  level: DEBUG
  baud_rate: 0

api:

sensor:
  - platform: adc
    pin: GPIO36
    name: "adc1"
    attenuation: 12db
  - platform: adc
    pin: GPIO32
    name: "adc2"
    attenuation: 12db

output:
  # 10 kHz as in the stock firmware
  - platform: ledc
    pin: GPIO19
    id: output_warm
    frequency: 10000
  - platform: ledc
    pin: GPIO21
    id: output_cold
    frequency: 10000
  - platform: ledc
    pin: GPIO23
    id: output_nightlight

light:
  - platform: monochromatic
    name: "night light"
    id: night_light
    output: output_nightlight
    gamma_correct: 0
    on_turn_on:
      - light.turn_off: ceiling_light
  # Warm/cold mixing of the stock firmware 2.0.6_0023
  - platform: yeelight_cct
    name: "ceiling light"
    id: ceiling_light
    warm_white: output_warm
    cold_white: output_cold
    interpolation: quadratic
    min_share: 8%
    min_brightness: 15%
    min_duty: 8%
    mixing_table:
      - {color_temperature: 2700 K, warm_white: 100%, cold_white: 0%}
      - {color_temperature: 3000 K, warm_white: 85.74%, cold_white: 8.08%}
      - {color_temperature: 3200 K, warm_white: 81.08%, cold_white: 16.45%}
      - {color_temperature: 3400 K, warm_white: 74.87%, cold_white: 23.44%}
      - {color_temperature: 4000 K, warm_white: 56.14%, cold_white: 43.58%}
      - {color_temperature: 4500 K, warm_white: 42.61%, cold_white: 57.41%}
      - {color_temperature: 5000 K, warm_white: 30.32%, cold_white: 69.23%}
      - {color_temperature: 5500 K, warm_white: 20.42%, cold_white: 77.93%}
      - {color_temperature: 5800 K, warm_white: 17.50%, cold_white: 80.40%}
      - {color_temperature: 6000 K, warm_white: 11.30%, cold_white: 85.94%}
      - {color_temperature: 6500 K, warm_white: 0%, cold_white: 100%}
    on_turn_on:
      - light.turn_off: night_light
