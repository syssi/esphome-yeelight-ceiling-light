# To keep a copy of the stock firmware, uncomment the `packages:` block below
# BEFORE the first flash. Only that first flash leaves the stock firmware
# readable - the next one overwrites it. See docs/flashing-over-the-network.md.
#
# packages:
#   flash_probe: !include flash_probe.yaml

substitutions:
  name: yeelight-light-lamp9
  external_components_source: github://syssi/esphome-yeelight-ceiling-light@main

esphome:
  name: ${name}
  friendly_name: ${name}
  min_version: 2024.10.0

esp32:
  board: esp32doit-devkit-v1
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_FREERTOS_UNICORE: y
      # Please uncomment these parameters if fast booting is important to you
      # CONFIG_BOOTLOADER_SKIP_VALIDATE_ON_POWER_ON: y
      # CONFIG_BOOTLOADER_LOG_LEVEL_NONE: y
      # CONFIG_LOG_DEFAULT_LEVEL_NONE: y
    advanced:
      ignore_efuse_mac_crc: true
      ignore_efuse_custom_mac: true

external_components:
  - source: ${external_components_source}
    refresh: 0s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2

ota:
  platform: esphome

logger:
  level: DEBUG
  baud_rate: 0

api:

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO14
      inverted: true
    name: "button"
    id: button
    on_click:
      then:
        - if:
            condition:
              light.is_off: bedside_light
            then:
              light.turn_on:
                id: bedside_light
                brightness: 1.0
            else:
              light.turn_off: bedside_light
    on_press:
      then:
        - if:
            condition:
              light.is_off: bedside_light
            then:
              - delay: 0.5s
              - while:
                  condition:
                    binary_sensor.is_on: button
                  then:
                    - light.dim_relative:
                        id: bedside_light
                        relative_brightness: 5%
                        transition_length: 0.1s
                    - delay: 0.1s
            else:
              - delay: 0.5s
              - while:
                  condition:
                    and:
                      - binary_sensor.is_on: button
                      - light.is_on: bedside_light
                  then:
                    - light.dim_relative:
                        id: bedside_light
                        relative_brightness: -5%
                        transition_length: 0.1s
                    - delay: 0.1s

output:
  - platform: ledc
    pin: GPIO2
    id: output_warm
    frequency: 20kHz
    power_supply: power
    # Minimum duty of a lit channel; off stays off. The stock firmware uses 3 % for
    # warm and 4 % for cold
    min_power: 3%
    zero_means_zero: true
  - platform: ledc
    pin: GPIO27
    id: output_cold
    frequency: 20kHz
    power_supply: power
    min_power: 4%
    zero_means_zero: true
  - platform: ledc
    pin: GPIO12
    id: output_nightlight
    frequency: 20kHz
    power_supply: power
  - platform: gpio
    pin: GPIO33
    id: led_output

power_supply:
  - id: power
    pin: GPIO4
    enable_time: 0s
    keep_on_time: 2s

light:
  - platform: monochromatic
    name: "night light"
    id: night_light
    output: output_nightlight
    gamma_correct: 0
    on_turn_on:
      - light.turn_off: bedside_light
  - platform: yeelight_cct
    name: "bedside light"
    id: bedside_light
    warm_white: output_warm
    cold_white: output_cold
    interpolation: quadratic
    min_share: 3%
    brightness_curve: quadratic
    min_brightness: 3%
    mixing_table:
      - {color_temperature: 2700 K, warm_white: 100%, cold_white: 0%}
      - {color_temperature: 2800 K, warm_white: 85.965%, cold_white: 3.765%}
      - {color_temperature: 2900 K, warm_white: 81.837%, cold_white: 7.936%}
      - {color_temperature: 3000 K, warm_white: 77.834%, cold_white: 11.980%}
      - {color_temperature: 3200 K, warm_white: 69.399%, cold_white: 19.461%}
      - {color_temperature: 3400 K, warm_white: 63.544%, cold_white: 27.460%}
      - {color_temperature: 3700 K, warm_white: 53.834%, cold_white: 38.313%}
      - {color_temperature: 4000 K, warm_white: 44.333%, cold_white: 47.913%}
      - {color_temperature: 4250 K, warm_white: 37.138%, cold_white: 55.183%}
      - {color_temperature: 4500 K, warm_white: 30.059%, cold_white: 61.294%}
      - {color_temperature: 4750 K, warm_white: 23.634%, cold_white: 66.745%}
      - {color_temperature: 5000 K, warm_white: 17.837%, cold_white: 71.561%}
      - {color_temperature: 5250 K, warm_white: 12.698%, cold_white: 76.753%}
      - {color_temperature: 5500 K, warm_white: 7.931%, cold_white: 81.049%}
      - {color_temperature: 6000 K, warm_white: 2.820%, cold_white: 86.214%}
      - {color_temperature: 6500 K, warm_white: 0%, cold_white: 100%}
    on_turn_on:
      - light.turn_off: night_light
  - platform: binary
    name: "mainboard led"
    output: led_output

# A eeprom at address 0x10 should be found.
# i2c:
#   - id: i2c_bus
#     sda: GPIO17
#     scl: GPIO18
#     scan: true
