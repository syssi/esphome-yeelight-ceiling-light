# To keep a copy of the stock firmware, uncomment the `packages:` block below
# BEFORE the first flash. Only that first flash leaves the stock firmware
# readable - the next one overwrites it. See docs/flashing-over-the-network.md.
#
# packages:
#   flash_probe: !include flash_probe.yaml

substitutions:
  name: yeelight-light-ceiling10
  external_components_source: github://syssi/esphome-yeelight-ceiling-light@main

esphome:
  name: ${name}
  friendly_name: ${name}
  min_version: 2024.10.0

esp32:
  board: esp32doit-devkit-v1
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_FREERTOS_UNICORE: y
      # Please uncomment these parameters if fast booting is important to you
      # CONFIG_BOOTLOADER_SKIP_VALIDATE_ON_POWER_ON: y
      # CONFIG_BOOTLOADER_LOG_LEVEL_NONE: y
      # CONFIG_LOG_DEFAULT_LEVEL_NONE: y
    advanced:
      ignore_efuse_mac_crc: true
      ignore_efuse_custom_mac: true

external_components:
  - source: ${external_components_source}
    refresh: 0s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2

ota:
  platform: esphome

logger:
  level: DEBUG
  baud_rate: 0

api:

output:
  - platform: ledc
    pin: GPIO19
    id: output_warm
    frequency: 10kHz
    power_supply: power
    # Minimum duty of a lit channel; off stays off. No max_power: the mixing table
    # already limits both channels to about 80 %
    min_power: 10%
    zero_means_zero: true
  - platform: ledc
    pin: GPIO21
    id: output_cold
    frequency: 10kHz
    power_supply: power
    min_power: 10%
    zero_means_zero: true

  - platform: ledc
    pin: GPIO23
    id: output_nightlight
    frequency: 20kHz
    power_supply: power

  - platform: ledc
    pin: GPIO33
    id: output_red
    frequency: 10kHz
    power_supply: power
  - platform: ledc
    pin: GPIO26
    id: output_green
    frequency: 10kHz
    power_supply: power
  - platform: ledc
    pin: GPIO27
    id: output_blue
    frequency: 10kHz
    power_supply: power

power_supply:
  - id: power
    pin: GPIO22
    enable_time: 0s
    keep_on_time: 0s

light:
  - platform: monochromatic
    name: "night light"
    id: night_light
    output: output_nightlight
    gamma_correct: 0
    on_turn_on:
      - light.turn_off: ceiling_light
  - platform: yeelight_cct
    name: "ceiling light"
    id: ceiling_light
    warm_white: output_warm
    cold_white: output_cold
    interpolation: quadratic
    min_share: 10%
    min_brightness: 5%
    mixing_table:
      - {color_temperature: 2700 K, warm_white: 80.896%, cold_white: 0%}
      - {color_temperature: 3000 K, warm_white: 67.161%, cold_white: 11.856%}
      - {color_temperature: 3200 K, warm_white: 59.698%, cold_white: 18%}
      - {color_temperature: 3400 K, warm_white: 56.1%, cold_white: 25.267%}
      - {color_temperature: 4000 K, warm_white: 37.889%, cold_white: 40.066%}
      - {color_temperature: 4500 K, warm_white: 26.781%, cold_white: 50.778%}
      - {color_temperature: 5000 K, warm_white: 17.657%, cold_white: 62.143%}
      - {color_temperature: 5500 K, warm_white: 9.583%, cold_white: 68.576%}
      - {color_temperature: 5800 K, warm_white: 7.245%, cold_white: 70.496%}
      - {color_temperature: 6000 K, warm_white: 0%, cold_white: 79.524%}
      - {color_temperature: 6500 K, warm_white: 0%, cold_white: 79.524%}
    on_turn_on:
      - light.turn_off: night_light
  - platform: rgb
    name: "ambient light"
    red: output_red
    green: output_green
    blue: output_blue
    gamma_correct: 0
