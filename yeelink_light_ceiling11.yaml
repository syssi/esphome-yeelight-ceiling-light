# merged configuration of:
# - https://github.com/syssi/esphome-yeelight-ceiling-light/blob/main/yeelink_light_ceiling15.yaml
# - https://github.com/jaddel/ESPHome-Configurations/blob/master/Devices/Ceiling%20Yeelight%20YLXD41YL/ceiling_yeelight_ylxd41xl.yaml

# To keep a copy of the stock firmware, uncomment the `packages:` block below
# BEFORE the first flash. Only that first flash leaves the stock firmware
# readable - the next one overwrites it. See docs/flashing-over-the-network.md.
#
# packages:
#   flash_probe: !include flash_probe.yaml

substitutions:
  name: yeelight-light-ceiling11
  external_components_source: github://syssi/esphome-yeelight-ceiling-light@main

esphome:
  name: ${name}
  friendly_name: ${name}
  min_version: 2024.10.0

esp32:
  board: esp32doit-devkit-v1
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_FREERTOS_UNICORE: y
      # Please uncomment these parameters if fast booting is important to you
      # CONFIG_BOOTLOADER_SKIP_VALIDATE_ON_POWER_ON: y
      # CONFIG_BOOTLOADER_LOG_LEVEL_NONE: y
      # CONFIG_LOG_DEFAULT_LEVEL_NONE: y
    advanced:
      ignore_efuse_mac_crc: true
      ignore_efuse_custom_mac: true

external_components:
  - source: ${external_components_source}
    refresh: 0s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2

ota:
  platform: esphome

logger:
  level: DEBUG
  baud_rate: 0

api:

sensor:
  - platform: adc
    pin: GPIO36
    name: "adc1"
    attenuation: 12db
  - platform: adc
    pin: GPIO32
    name: "adc2"
    attenuation: 12db

output:
  - platform: ledc
    pin: GPIO19
    id: output_warm
    frequency: 10kHz
    # Minimum duty of a lit channel; off stays off
    min_power: 8%
    zero_means_zero: true
  - platform: ledc
    pin: GPIO21
    id: output_cold
    frequency: 10kHz
    min_power: 8%
    zero_means_zero: true
  - platform: ledc
    pin: GPIO23
    id: output_nightlight
    frequency: 20kHz

light:
  - platform: monochromatic
    name: "${name}-nightlight"
    id: night_light
    output: output_nightlight
    gamma_correct: 0.7
    on_turn_on:
      - light.turn_off: ceiling_light
  - platform: yeelight_cct
    name: "${name}"
    id: ceiling_light
    warm_white: output_warm
    cold_white: output_cold
    interpolation: none
    min_brightness: 15%
    mixing_table:
      - {color_temperature: 2700 K, warm_white: 100%, cold_white: 0%}
      - {color_temperature: 3000 K, warm_white: 79.11%, cold_white: 9.99%}
      - {color_temperature: 3200 K, warm_white: 71.62%, cold_white: 16.89%}
      - {color_temperature: 3400 K, warm_white: 65.26%, cold_white: 23.48%}
      - {color_temperature: 4000 K, warm_white: 48.53%, cold_white: 41.14%}
      - {color_temperature: 4500 K, warm_white: 35.99%, cold_white: 53.24%}
      - {color_temperature: 5000 K, warm_white: 24.75%, cold_white: 63.48%}
      - {color_temperature: 5500 K, warm_white: 15.79%, cold_white: 71.82%}
      - {color_temperature: 5800 K, warm_white: 13.35%, cold_white: 74.22%}
      - {color_temperature: 6000 K, warm_white: 7.28%, cold_white: 80.91%}
      - {color_temperature: 6500 K, warm_white: 0%, cold_white: 100%}
    on_turn_on:
      - light.turn_off: night_light
