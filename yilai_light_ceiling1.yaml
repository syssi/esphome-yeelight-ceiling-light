# Yilai Aiyue 480 Ceiling Light (YIXD05YI, yilai.light.ceiling1)
#
# Untested on a device, see
# https://github.com/syssi/esphome-yeelight-ceiling-light/issues/88

substitutions:
  name: yilai-light-ceiling1
  external_components_source: github://syssi/esphome-yeelight-ceiling-light@main

esphome:
  name: ${name}
  friendly_name: ${name}
  min_version: 2024.10.0

esp32:
  board: esp32doit-devkit-v1
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_FREERTOS_UNICORE: y
      # Please uncomment these parameters if fast booting is important to you
      # CONFIG_BOOTLOADER_SKIP_VALIDATE_ON_POWER_ON: y
      # CONFIG_BOOTLOADER_LOG_LEVEL_NONE: y
      # CONFIG_LOG_DEFAULT_LEVEL_NONE: y
    advanced:
      ignore_efuse_mac_crc: true
      ignore_efuse_custom_mac: true

external_components:
  - source: ${external_components_source}
    refresh: 0s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2

ota:
  platform: esphome

logger:
  level: DEBUG
  baud_rate: 0

api:

output:
  - platform: ledc
    pin: GPIO19
    id: output_warm
    frequency: 3kHz
    # Minimum duty of a lit channel; off stays off
    min_power: 7%
    zero_means_zero: true
  - platform: ledc
    pin: GPIO21
    id: output_cold
    frequency: 3kHz
    min_power: 7%
    zero_means_zero: true

light:
  # Warm/cold mixing without interpolation: each table point holds up to the next one
  - platform: yeelight_cct
    name: "ceiling light"
    id: ceiling_light
    warm_white: output_warm
    cold_white: output_cold
    interpolation: none
    min_brightness: 10%
    mixing_table:
      - {color_temperature: 2700 K, warm_white: 100%, cold_white: 0%}
      - {color_temperature: 3000 K, warm_white: 94.624%, cold_white: 8.602%}
      - {color_temperature: 3200 K, warm_white: 89.247%, cold_white: 11.828%}
      - {color_temperature: 3400 K, warm_white: 98.656%, cold_white: 20.699%}
      - {color_temperature: 4000 K, warm_white: 78.495%, cold_white: 40.860%}
      - {color_temperature: 4500 K, warm_white: 59.677%, cold_white: 59.677%}
      - {color_temperature: 5000 K, warm_white: 42.204%, cold_white: 77.151%}
      - {color_temperature: 5500 K, warm_white: 23.387%, cold_white: 95.968%}
      - {color_temperature: 5800 K, warm_white: 11.828%, cold_white: 89.247%}
      - {color_temperature: 6000 K, warm_white: 8.602%, cold_white: 94.624%}
      - {color_temperature: 6500 K, warm_white: 0%, cold_white: 100%}
